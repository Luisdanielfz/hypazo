name: Release

# Al publicar una etiqueta v* se compila el instalador .exe y se adjunta a la Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    env:
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de los tests
        run: python -m pip install pytest httpx fastapi uvicorn pydantic

      - name: Tests
        run: |
          python -m pytest tests/piloto/test_install_ps1.py tests/piloto/test_credito.py tests/piloto/test_sesion.py tests/piloto/test_resumen.py tests/piloto/test_revision.py -q -rf *> pytest.txt
          $codigo = $LASTEXITCODE
          Get-Content pytest.txt
          if ($codigo -ne 0) {
            # Las anotaciones se leen sin iniciar sesión (máximo 10 por paso): solo las líneas del error.
            (Select-String -Path pytest.txt -Pattern "^E |^FAILED").Line | Select-Object -First 9 | ForEach-Object { Write-Host "::error::$($_.Substring(0, [Math]::Min(900, $_.Length)))" }
            exit $codigo
          }

      - name: Inno Setup
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Compilar el instalador
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DVersion=${{ github.ref_name }}" installer\hypazo.iss'

      # Firma con Azure Artifact Signing. Solo se ejecuta cuando están configurados los secretos del repositorio
      # (guía: Obsidian "Hypazo - Firma del instalador"); sin ellos el .exe sale sin firmar, como hasta ahora.
      - name: Firmar el instalador
        if: env.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Hypazo-Setup-*.exe
          generate_release_notes: true
